<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f10; --surface: #18181b; --surface2: #1f1f24;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #f0efe9; --text2: rgba(255,255,255,0.6); --text3: rgba(255,255,255,0.4);
    --accent: #e8c97e; --accent2: rgba(232,201,126,0.12); --accent3: rgba(232,201,126,0.06);
    --green: #4ade80; --green-bg: rgba(74,222,128,0.08);
    --red: #f87171; --red-bg: rgba(248,113,113,0.08);
    --blue: #60a5fa; --blue-bg: rgba(96,165,250,0.08);
    --purple: #a78bfa; --purple-bg: rgba(167,139,250,0.08);
    --tag-bg: rgba(255,255,255,0.05);
  }
  body { font-family: 'Geist', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  /* NAV */
  .topnav { height: 48px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 10px; flex-shrink: 0; background: var(--surface); }
  #save-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--surface); border:1px solid var(--border2); border-radius:8px; padding:8px 16px; font-size:14px; color:var(--text2); opacity:0; pointer-events:none; transition:opacity 0.2s,transform 0.2s; z-index:999; }
  #save-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #save-toast.ok { border-color:rgba(74,222,128,0.4); color:var(--green); }
  #save-toast.err { border-color:rgba(248,113,113,0.4); color:var(--red); }
  .logo { font-family: 'Instrument Serif', serif; font-size: 23px; color: var(--accent); flex-shrink: 0; }
  .nav-sep { width: 1px; height: 16px; background: var(--border2); flex-shrink: 0; }
  .project-pill { display: flex; align-items: center; gap: 5px; font-size: 17px; color: var(--text2); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); cursor: pointer; flex-shrink: 0; }
  .project-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .search-wrap { flex: 1; max-width: 440px; margin: 0 auto; position: relative; }
  .search-input-row { display: flex; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; height: 32px; transition: border-color 0.15s; }
  .search-input-row:focus-within { border-color: var(--accent); }
  .search-icon { font-size: 20px; color: var(--text3); margin-right: 6px; }
  .search-input { flex: 1; background: transparent; border: none; outline: none; font-family: 'Geist', sans-serif; font-size: 18px; color: var(--text); }
  .search-input::placeholder { color: var(--text3); }
  .search-mode-toggle { display: flex; gap: 2px; margin-left: 6px; }
  .mode-btn { font-size: 14px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--text3); cursor: pointer; font-family: 'Geist', sans-serif; transition: all 0.15s; }
  .mode-btn.active { background: var(--accent2); color: var(--accent); border-color: rgba(232,201,126,0.3); }
  .search-dropdown { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; overflow: hidden; display: none; z-index: 100; max-height: 480px; overflow-y: auto; }
  .search-dropdown.open { display: block; }
  .sd-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 6px; border-bottom: 1px solid var(--border); }
  .sd-title { font-size: 15px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; }
  .ai-thinking { display: flex; align-items: center; gap: 4px; color: var(--accent); font-size: 15px; }
  .ai-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .ai-dot:nth-child(2) { animation-delay: 0.2s; }
  .ai-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
  .sd-section-label { font-size: 14px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; padding: 8px 12px 4px; }
  .sd-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; cursor: pointer; transition: background 0.1s; }
  .sd-item:hover { background: var(--surface2); }
  .sd-item-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .sd-item-icon.qa { background: var(--red-bg); }
  .sd-item-icon.qa.resolved { background: var(--green-bg); }
  .sd-item-icon.screen { background: var(--blue-bg); }
  .sd-item-icon.decision { background: var(--accent2); }
  .sd-item-body { flex: 1; min-width: 0; }
  .sd-item-title { font-size: 18px; font-weight: 500; color: var(--text); line-height: 1.4; }
  .sd-item-sub { font-size: 15px; color: var(--text2); margin-top: 2px; line-height: 1.4; }
  .sd-item-meta { display: flex; gap: 5px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .sd-badge { font-size: 14px; padding: 1px 5px; border-radius: 3px; }
  .sd-badge.qa { background: var(--red-bg); color: var(--red); }
  .sd-badge.qa-resolved { background: var(--green-bg); color: var(--green); }
  .sd-badge.screen { background: var(--blue-bg); color: var(--blue); }
  .sd-badge.decision { background: var(--accent2); color: var(--accent); }
  .sd-badge.ai { background: var(--purple-bg); color: var(--purple); }
  .sd-score { font-size: 14px; color: var(--text3); }
  .sd-relevance { width: 32px; height: 3px; border-radius: 2px; background: var(--surface2); overflow: hidden; margin-top: 7px; flex-shrink: 0; }
  .sd-relevance-bar { height: 100%; border-radius: 2px; background: var(--accent); }
  .sd-ai-summary { margin: 6px 12px 8px; background: var(--accent3); border: 1px solid rgba(232,201,126,0.15); border-radius: 7px; padding: 10px 12px; }
  .sd-ai-label { font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 5px; }
  .sd-ai-text { font-size: 17px; color: var(--text2); line-height: 1.6; }
  .sd-empty { padding: 20px; text-align: center; color: var(--text3); font-size: 18px; }
  .sd-divider { height: 1px; background: var(--border); margin: 4px 0; }
  .nav-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--accent2); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: var(--accent); }
  .avatar.dim { opacity: 0.45; border-color: var(--border2); background: var(--surface2); color: var(--text3); }
  .btn-new { height: 26px; padding: 0 10px; background: var(--accent); color: #1a1600; border: none; border-radius: 5px; font-family: 'Geist', sans-serif; font-size: 17px; font-weight: 500; cursor: pointer; }

  /* MAIN */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  .sidebar { width: 200px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .sb-section { padding: 10px 12px 4px; font-size: 14px; font-weight: 500; letter-spacing: 0.12em; color: var(--text3); text-transform: uppercase; }
  .sb-scroll { flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: none; }
  .sb-scroll::-webkit-scrollbar { display: none; }
  .sb-item { display: flex; align-items: center; gap: 7px; padding: 6px 12px; font-size: 17px; color: var(--text2); cursor: pointer; border-left: 2px solid transparent; transition: all 0.1s; }
  .sb-item:hover { background: var(--surface2); color: var(--text); }
  .sb-item.active { background: var(--accent3); color: var(--accent); border-left-color: var(--accent); }
  .sb-item[draggable="true"] { cursor: grab; }
  .sb-item.dragging { opacity: 0.35; pointer-events: none; }
  .sb-item.drag-over { border-top: 2px solid var(--accent); }
  .sb-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.4; flex-shrink: 0; }
  .sb-count { margin-left: auto; font-size: 14px; background: var(--tag-bg); border-radius: 8px; padding: 1px 5px; color: var(--text3); }
  .sb-item.active .sb-count { background: var(--accent2); color: var(--accent); }
  #sb-ctx-menu { position:fixed; background:var(--surface); border:1px solid var(--border2); border-radius:8px; padding:4px; z-index:999; display:none; min-width:100px; box-shadow:0 4px 16px rgba(0,0,0,0.4); }
  .sb-ctx-item { padding:7px 12px; font-size:15px; border-radius:5px; cursor:pointer; }
  .sb-ctx-item:hover { background:var(--surface2); }
  .sb-ctx-item.danger { color:var(--red); }
  .sb-ctx-item.danger:hover { background:var(--red-bg); }
  .sb-bottom { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; }
  .link-label { font-size: 14px; color: var(--text3); margin-bottom: 3px; }
  .link-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 5px 7px; font-family: 'Geist', sans-serif; font-size: 15px; color: var(--text2); outline: none; }
  .link-input:focus { border-color: var(--accent); }
  .link-input::placeholder { color: var(--text3); }
  .spec-range-input { margin-top: 4px; }
  .load-btn { width: 100%; padding: 5px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 5px; font-family: 'Geist', sans-serif; font-size: 15px; color: var(--text2); cursor: pointer; transition: all 0.15s; margin-top: 4px; }
  .load-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* CENTER */
  .center-col { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; min-width: 0; position: relative; }
  .panel-header { height: 38px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 7px; flex-shrink: 0; background: var(--surface); }
  .panel-title { font-size: 15px; font-weight: 500; color: var(--text2); letter-spacing: 0.07em; text-transform: uppercase; }
  .panel-badge { font-size: 15px; padding: 2px 6px; border-radius: 6px; background: var(--tag-bg); color: var(--text3); }
  .panel-actions { margin-left: auto; display: flex; gap: 5px; align-items: center; }
  .slack-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 14px; padding: 2px 6px; border-radius: 6px; background: var(--green-bg); color: var(--green); border: 1px solid rgba(74,222,128,0.2); }
  .slack-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--green); }
  .icon-btn { width: 24px; height: 24px; border-radius: 4px; background: transparent; border: 1px solid var(--border); color: var(--text3); cursor: pointer; font-size: 17px; display: flex; align-items: center; justify-content: center; }
  .figma-frame { flex: 1; min-height: 0; background: var(--surface2); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .figma-frame::before { content:''; position:absolute; inset:0; background-image:linear-gradient(45deg,rgba(255,255,255,0.015) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,0.015) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,0.015) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,0.015) 75%); background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; }
  .figma-ph { position:relative; z-index:1; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .figma-icon-box { width:40px; height:40px; border-radius:10px; background:var(--surface); border:1px solid var(--border2); display:flex; align-items:center; justify-content:center; font-size:27px; }
  .figma-ph p { font-size:18px; color:var(--text2); }
  .figma-ph span { font-size:15px; color:var(--text3); }
  #figma-iframe { width:100%; height:100%; border:none; display:none; position:relative; z-index:1; }
  .spec-panel { position:absolute; bottom:-442px; left:0; right:0; height:480px; border-top:1px solid var(--border); background:var(--surface); overflow:hidden; transition:bottom 0.28s ease; z-index:10; }
  .spec-panel.open { bottom:0; }
  .spec-header { height:38px; display:flex; align-items:center; padding:0 12px; gap:7px; cursor:pointer; }
  .spec-actions { margin-left:auto; display:flex; align-items:center; gap:4px; }
  .spec-refresh-btn { background:none; border:none; color:var(--text3); cursor:pointer; display:none; align-items:center; padding:2px 4px; border-radius:4px; transition:color 0.15s; }
  .spec-refresh-btn:hover { color:var(--accent); }
  .spec-panel.open .spec-refresh-btn { display:flex; }
  .spec-toggle { font-size:15px; color:var(--text3); display:flex; align-items:center; gap:3px; }
  .spec-toggle svg { transition:transform 0.28s; transform:rotate(180deg); }
  .spec-panel.open .spec-toggle svg { transform:rotate(0deg); }
  .spec-panel.open .spec-toggle { color:var(--accent); }
  .spec-body { height:442px; overflow:hidden; position:relative; }
  .spec-iframe-wrap { position:absolute; top:0; left:0; right:0; bottom:0; overflow:hidden; display:none; }
  #spec-iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
  .spec-range-content { display:none; position:absolute; top:0; left:0; right:0; bottom:0; overflow:auto; padding:12px; }
  .spec-table { border-collapse:collapse; width:100%; font-size:14px; }
  .spec-table th, .spec-table td { border:1px solid var(--border); padding:6px 10px; color:var(--text); text-align:left; vertical-align:top; white-space:pre-wrap; line-height:1.5; }
  .spec-table th { background:var(--surface2); color:var(--text2); font-weight:500; }
  .spec-empty { display:flex; align-items:center; justify-content:center; height:100%; }
  .spec-empty p { font-size:17px; color:var(--text3); }

  /* RIGHT PANEL */
  .right-panel { width: 440px; display: flex; flex-direction: column; background: var(--surface); flex-shrink: 0; overflow: hidden; }
  .rp-tabs { height: 38px; border-bottom: 1px solid var(--border); display: flex; align-items: stretch; flex-shrink: 0; }
  .rp-tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 17px; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .rp-tab:hover { color: var(--text2); background: var(--surface2); }
  .rp-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent3); }
  .rp-tab-count { font-size: 14px; padding: 1px 5px; border-radius: 6px; background: var(--tag-bg); color: var(--text3); }
  .rp-tab.active .rp-tab-count { background: var(--accent2); color: var(--accent); }
  .screen-info-wrap { flex: 1; display: none; overflow: hidden; }
  .screen-info-wrap.active { display: flex; flex-direction: column; overflow: hidden; }
  .screen-info { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; }
  .screen-info::-webkit-scrollbar { width: 3px; }
  .screen-info::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .info-section { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
  .info-section:last-child { border-bottom: none; }
  .info-label { font-size: 14px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); margin-bottom: 5px; }
  .info-value { font-size: 15px; color: var(--text2); line-height: 1.6; }
  .info-value.primary { font-size: 15px; color: var(--text); font-weight: 500; line-height: 1.5; }
  .kpi-list { display: flex; flex-direction: column; gap: 4px; }
  .kpi-item { display: flex; align-items: center; gap: 7px; padding: 5px 8px; background: var(--surface2); border-radius: 5px; border: 1px solid var(--border); }
  .kpi-name { font-size: 15px; color: var(--text2); flex: 1; }
  .kpi-value { font-size: 15px; font-weight: 500; color: var(--accent); }
  .kpi-trend { font-size: 15px; color: var(--green); }
  .decision-list { display: flex; flex-direction: column; gap: 5px; }
  .decision-item { background: var(--surface2); border-radius: 5px; padding: 7px 9px; border-left: 2px solid var(--accent); }
  .decision-q { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
  .decision-why { font-size: 15px; color: var(--text3); line-height: 1.5; }
  .decision-reconsider { font-size: 15px; color: var(--blue); background: var(--blue-bg); border: 1px solid rgba(96,165,250,0.2); border-radius: 5px; padding: 5px 9px; margin-top: 6px; line-height: 1.5; }
  .reconsider-list { display: flex; flex-direction: column; gap: 3px; }
  .reconsider-item { display: flex; align-items: flex-start; gap: 5px; font-size: 15px; color: var(--text2); line-height: 1.5; }
  .reconsider-icon { color: var(--red); font-size: 15px; margin-top: 2px; flex-shrink: 0; }
  .owner-list { display: flex; gap: 6px; flex-wrap: wrap; }
  .owner-item { display: flex; align-items: center; gap: 5px; padding: 4px 7px; background: var(--surface2); border-radius: 5px; border: 1px solid var(--border); }
  .history-list { display:flex; flex-direction:column; gap:5px; }
  .history-item { display:flex; gap:8px; align-items:flex-start; padding:6px 8px; background:var(--surface2); border-radius:5px; border-left:2px solid var(--border2); }
  .history-date { font-size:13px; color:var(--text3); white-space:nowrap; padding-top:1px; flex-shrink:0; }
  .history-content { font-size:15px; color:var(--text); line-height:1.5; white-space:pre-wrap; }
  .owner-avatar { width: 18px; height: 18px; border-radius: 50%; background: var(--accent2); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--accent); font-weight: 500; }
  .owner-name { font-size: 15px; color: var(--text2); }
  .owner-role { font-size: 15px; color: var(--text3); }
  .history-list { display: flex; flex-direction: column; }
  .history-item { display: flex; gap: 8px; padding: 4px 0; position: relative; }
  .history-item::before { content:''; position:absolute; left:4px; top:14px; bottom:-4px; width:1px; background:var(--border); }
  .history-item:last-child::before { display:none; }
  .history-dot { width:9px; height:9px; border-radius:50%; background:var(--surface2); border:1px solid var(--border2); flex-shrink:0; margin-top:3px; }
  .history-dot.latest { background:var(--accent2); border-color:var(--accent); }
  .history-what { font-size:15px; color:var(--text2); line-height:1.4; }
  .history-meta { font-size:15px; color:var(--text3); }
  .figma-chips { display:flex; gap:5px; flex-wrap:wrap; }
  .figma-chip { display:flex; align-items:center; gap:4px; padding:3px 7px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; font-size:15px; color:var(--text2); cursor:pointer; }
  .figma-chip:hover { border-color:var(--accent); color:var(--accent); }
  .figma-chip-dot { width:5px; height:5px; border-radius:1px; background:var(--purple); }
  .qa-body { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .qa-body.active { display: flex; }
  .qa-sub-tabs { display: flex; gap: 2px; padding: 7px 9px 0; flex-shrink: 0; }
  .qa-sub-tab { font-size: 15px; padding: 2px 7px; border-radius: 4px; color: var(--text3); cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
  .qa-sub-tab.active { background: var(--accent2); color: var(--accent); border-color: rgba(232,201,126,0.2); }
  .qa-list { flex: 1; overflow-y: auto; padding: 7px 9px; display: flex; flex-direction: column; gap: 5px; }
  .qa-list::-webkit-scrollbar { width: 3px; }
  .qa-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .qa-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 9px; cursor: pointer; transition: all 0.15s; }
  .qa-card:hover { border-color: var(--border2); }
  .qa-card.active { border-color: var(--accent); background: var(--accent3); }
  .qa-card-top { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
  .qa-status { width: 14px; height: 14px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; margin-top: 1px; }
  .qa-status.resolved { background: var(--green-bg); color: var(--green); }
  .qa-status.open { background: var(--red-bg); color: var(--red); }
  .qa-status.notice { background: var(--surface2); font-size: 10px; }
  .qa-q { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.4; flex: 1; }
  .qa-a-preview { font-size: 12px; color: var(--text2); line-height: 1.5; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }
  .qa-meta { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .qa-tag { font-size: 14px; padding: 1px 4px; border-radius: 3px; background: var(--tag-bg); color: var(--text3); border: 1px solid var(--border); }
  .qa-time { font-size: 14px; color: var(--text3); margin-left: auto; }
  .src-badge { display: inline-flex; align-items: center; gap: 2px; font-size: 14px; padding: 1px 4px; border-radius: 3px; }
  .src-slack { background: var(--green-bg); color: var(--green); }

<script>
const GEMINI_API_KEY = 'AIzaSyCcYUH6hluJ5zhsBZMKJh_Y94GhwtRkobs'

const GEMINI_MODEL = 'gemini-2.5-flash'

const SUPABASE_URL = 'https://xrvjbkrhuohvsyzmiuti.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WPM-JkBAGI5hbOVF7do_Fw_d09RaU_S';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const screens = {};
let screenOrder = [];
let dragSrcKey = null;

const qaData = {};

function buildIndex() {
  const items = [];
  Object.entries(screens).forEach(([key, s]) => {
    items.push({type:'screen',screenKey:key,title:s.name,body:s.purpose,sub:'화면 목적'});
    (s.decisions||[]).forEach(d => items.push({type:'decision',screenKey:key,title:d.q,body:d.why,sub:s.name+' · 결정사항'}));
    (s.kpis||[]).forEach(k => items.push({type:'screen',screenKey:key,title:k.name,body:k.value+' '+k.trend,sub:s.name+' · KPI'}));
    (s.decisions||[]).forEach(d => { if (d.reconsider) items.push({type:'screen',screenKey:key,title:d.reconsider,body:'',sub:s.name+' · 재논의조건'}); });
  });
  Object.entries(qaData).forEach(([key, qas]) => {
    qas.forEach(q => items.push({type:'qa',screenKey:key,qaId:q.id,title:q.q,body:q.a||'',status:q.status,source:q.source,sub:screens[key]?.name+' · Q&A'}));
  });
  return items;
}
let searchIndex = [];

let searchMode='keyword', searchTimer=null, currentScreen=null, currentRpTab='info', currentQaTab='all', activeQaCard=null, specOpen=false, aiController=null;

function setMode(mode) {
  searchMode = mode;
  document.getElementById('mode-keyword').classList.toggle('active', mode==='keyword');
  document.getElementById('mode-ai').classList.toggle('active', mode==='ai');
  const q = document.getElementById('search-input').value.trim();
  if (q) doSearch(q);
}

document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) { closeDropdown(); return; }
  searchTimer = setTimeout(() => doSearch(q), searchMode==='ai' ? 600 : 200);
});
document.getElementById('search-input').addEventListener('focus', e => { if (e.target.value.trim()) doSearch(e.target.value.trim()); });
document.addEventListener('click', e => { if (!document.getElementById('search-wrap').contains(e.target)) closeDropdown(); });
document.addEventListener('keydown', e => { if ((e.metaKey||e.ctrlKey) && e.key==='k') { e.preventDefault(); document.getElementById('search-input').focus(); } });

function closeDropdown() { const d=document.getElementById('search-dropdown'); d.classList.remove('open'); d.innerHTML=''; }
function doSearch(q) { searchMode==='keyword' ? doKeywordSearch(q) : doAISearch(q); }

function doKeywordSearch(query) {
  const q = query.toLowerCase();
  const results = searchIndex.filter(i => i.title.toLowerCase().includes(q) || i.body.toLowerCase().includes(q) || i.sub.toLowerCase().includes(q)).slice(0,8);
  renderResults(results, query, null, false);
}

async function doAISearch(query) {
  if (aiController) aiController.abort();
  aiController = new AbortController();
  const kwResults = searchIndex.filter(i => { const q=query.toLowerCase(); return i.title.toLowerCase().includes(q)||i.body.toLowerCase().includes(q); }).slice(0,5);
  renderResults(kwResults, query, null, true);
  const context = searchIndex.map((item,i) => `[${i}] type:${item.type} screen:${item.sub} title:"${item.title}" body:"${item.body}"`).join('\n');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', signal:aiController.signal,
      headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_API_KEY,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000,
        system:`당신은 프로덕트 팀의 Q&A 검색 도우미입니다. 다음 형식의 JSON만 반환하세요:\n{"summary":"2줄 이내 요약","matches":[{"index":숫자,"score":0~100,"reason":"관련 이유 한 줄"}]}\n최대 6개, score 높은 순.`,
        messages:[{role:'user',content:`쿼리: "${query}"\n\n데이터:\n${context}`}] })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || '';
    let parsed; try { parsed = JSON.parse(text); } catch { parsed = null; }
    if (parsed?.matches) {
      const aiResults = parsed.matches.filter(m=>m.index>=0&&m.index<searchIndex.length).map(m=>({...searchIndex[m.index],score:m.score,aiReason:m.reason}));
      renderResults(aiResults, query, parsed.summary, false);
    }
  } catch(e) { if (e.name!=='AbortError') renderResults(kwResults, query, null, false); }
}

function renderResults(results, query, aiSummary, thinking) {
  const dd = document.getElementById('search-dropdown');
  dd.classList.add('open');
  const hl = (text, q) => { if (!q||!text) return text||''; const re=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'); return text.replace(re,'<mark style="background:var(--accent2);color:var(--accent);border-radius:2px;padding:0 1px">$1</mark>'); };
  let html = `<div class="sd-header"><span class="sd-title">${results.length}개 결과</span><span>${thinking?`<span class="ai-thinking"><span class="ai-dot"></span><span class="ai-dot"></span><span class="ai-dot"></span>AI 분석 중</span>`:`<span style="font-size:15px;color:var(--text3)">${searchMode==='ai'?'AI 시맨틱':'키워드'} 검색</span>`}</span></div>`;
  if (aiSummary) html += `<div class="sd-ai-summary"><div class="sd-ai-label">✦ AI 요약</div><div class="sd-ai-text">${aiSummary}</div></div>`;
  if (!results.length) { html += `<div class="sd-empty">관련 결과를 찾지 못했어요</div>`; }
  else {
    const infoItems = results.filter(r=>r.type!=='qa'), qaItems = results.filter(r=>r.type==='qa');
    if (infoItems.length) { html += `<div class="sd-section-label">화면 정보</div>`; infoItems.forEach(item => { html += `<div class="sd-item" onclick="navigateTo('${item.screenKey}','info')"><div class="sd-item-icon screen">◉</div><div class="sd-item-body"><div class="sd-item-title">${hl(item.title,query)}</div>${item.body?`<div class="sd-item-sub">${hl(item.body,query)}</div>`:''}<div class="sd-item-meta"><span class="sd-badge ${item.type==='decision'?'decision':'screen'}">${item.type==='decision'?'결정사항':item.sub.includes('KPI')?'KPI':item.sub.includes('재논의')?'재논의':'화면정보'}</span><span class="sd-score">${item.sub}</span>${item.aiReason?`<span class="sd-badge ai">${item.aiReason}</span>`:''}</div></div>${item.score?`<div class="sd-relevance"><div class="sd-relevance-bar" style="width:${item.score}%"></div></div>`:''}</div>`; }); }
    if (qaItems.length) { if (infoItems.length) html+=`<div class="sd-divider"></div>`; html += `<div class="sd-section-label">Q&A</div>`; qaItems.forEach(item => { html += `<div class="sd-item" onclick="navigateTo('${item.screenKey}','qa',${item.qaId})"><div class="sd-item-icon qa ${item.status}">${item.status==='resolved'?'✓':'!'}</div><div class="sd-item-body"><div class="sd-item-title">${hl(item.title,query)}</div>${item.body?`<div class="sd-item-sub">${hl(item.body,query)}</div>`:''}<div class="sd-item-meta"><span class="sd-badge ${item.status==='resolved'?'qa-resolved':'qa'}">${item.status==='resolved'?'해결됨':'미해결'}</span><span class="sd-score">${item.sub}</span>${item.aiReason?`<span class="sd-badge ai">${item.aiReason}</span>`:''}</div></div>${item.score?`<div class="sd-relevance"><div class="sd-relevance-bar" style="width:${item.score}%"></div></div>`:''}</div>`; }); }
  }
  dd.innerHTML = html;
}

function renderQaList(tab) {
  const items = (qaData[currentScreen]||[]).filter(d=>tab==='notice'?d.itemType==='notice':(d.itemType!=='notice')&&(tab==='all'||d.status===tab));
  document.getElementById('qa-list').innerHTML = items.map(d=>`<div class="qa-card ${activeQaCard===d.id?'active':''}" onclick="showDetail('${d.id}')"><div class="qa-card-top"><div class="qa-status ${d.itemType==='notice'?'notice':d.status}">${d.itemType==='notice'?'🔖':d.status==='resolved'?'✓':'!'}</div><div class="qa-q">${nl2br(d.q)}</div></div>${(d.answers&&d.answers.length)?d.answers.map(ans=>`<div class="qa-a-preview">${nl2br(ans.text.length>120?ans.text.slice(0,120)+'…':ans.text)}</div>`).join(''):''}<div class="qa-meta">${d.tags.map(t=>`<span class="qa-tag">${t}</span>`).join('')}<span class="src-badge src-${d.source}">${d.source==='slack'?'슬랙':d.source==='figma'?'피그마':'직접입력'}</span><span class="qa-time">${d.time}</span></div></div>`).join('');

function findQaItem(id) {
  for (const [key, items] of Object.entries(qaData)) {
    const item = items.find(x => x.id === id);
    if (item) return { item, screenKey: key };
  }
  return null;
}

          <div style="font-size:15px;color:var(--text2);line-height:1.6;">${nl2br(ans.text)}</div></div>`).join('')
        : `<div style="font-size:15px;color:var(--text3);line-height:1.6;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;min-height:60px;">아직 답변이 없습니다.</div>`}

        <button class="modal-btn secondary" onclick="moveQaItem('${id}')">이동</button>

function editQaItem(id) {
  const found = findQaItem(id);
  if (!found) return;
  const { item: d } = found;

  document.getElementById('qm-header').innerHTML = `
    <div class="modal-title">Q&A 수정</div>
    <button class="modal-close" onclick="showDetail('${id}')">✕</button>`;

  document.getElementById('qm-body').innerHTML = `
    <div>
      <div class="mf-label">질문</div>
      <textarea id="edit-q" class="mf-input mf-textarea" style="min-height:80px;">${d.q}</textarea>
    </div>
    <div>
      <div class="mf-label">답변</div>
      ${(d.answers&&d.answers.length ? d.answers : [{text:d.a||''}]).map((ans,i)=>`<div style="display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;">${(d.answers&&d.answers.length>1)?`<span style="font-size:11px;color:var(--text3);padding-top:10px;min-width:32px;">답변${i+1}</span>`:''}
        <textarea id="edit-a-${i}" class="mf-input mf-textarea" style="min-height:80px;flex:1;">${ans.text}</textarea></div>`).join('')}

async function saveQaEdit(id) {
  const q = document.getElementById('edit-q').value.trim();
  if (!q) return;
  const found = findQaItem(id);
  if (!found) return;
  const origAnswers = found.item.answers && found.item.answers.length ? found.item.answers : [{text: found.item.a||''}];
  const newAnswers = origAnswers.map((ans, i) => {
    const el = document.getElementById(`edit-a-${i}`);
    return el ? {...ans, text: el.value.trim()} : ans;
  }).filter(ans => ans.text);
  const {error} = await sb.from('qa_items').update({question:q, answers:newAnswers}).eq('id', id);
  if (error) { alert('저장 실패: ' + error.message); return; }
  found.item.q = q;
  found.item.answers = newAnswers;
  found.item.a = newAnswers.length ? newAnswers[0].text : '';
  showDetail(id);
  renderQaList(currentQaTab);
}

async function deleteQaItem(id) {
  if (!confirm('이 Q&A를 삭제할까요?')) return;
  const {error} = await sb.from('qa_items').delete().eq('id', id);
  if (error) { alert('삭제 실패: ' + error.message); return; }
  const found = findQaItem(id);
  if (found) {
    qaData[found.screenKey] = qaData[found.screenKey].filter(x => x.id !== id);
    if (!qaData[found.screenKey].length) delete qaData[found.screenKey];
  }
  activeQaCard = null;
  closeDetail();
  renderQaList(currentQaTab);
  renderSidebarScreens();
}

async function moveQaItem(id) {
  const newScreenKey = document.getElementById('qa-move-select').value;
  const found = findQaItem(id);
  if (!found || found.screenKey === newScreenKey) return;
  const newScreenId = newScreenKey === '__unassigned__' ? null : newScreenKey;
  const {error} = await sb.from('qa_items').update({screen_id: newScreenId}).eq('id', id);
  if (error) { alert('이동 실패: ' + error.message); return; }
  const item = {...found.item};
  qaData[found.screenKey] = qaData[found.screenKey].filter(x => x.id !== id);
  if (!qaData[newScreenKey]) qaData[newScreenKey] = [];
  qaData[newScreenKey].unshift(item);
  currentScreen = newScreenKey;
  renderSidebarScreens();
  renderQaList(currentQaTab);
  showDetail(id);
}

async function toggleQaStatus(id) {
  const found = findQaItem(id);
  if (!found) return;
  const newStatus = found.item.status === 'resolved' ? 'open' : 'resolved';
  const {error} = await sb.from('qa_items').update({
    status: newStatus,
    resolved_at: newStatus === 'resolved' ? new Date().toISOString() : null
  }).eq('id', id);
  if (error) { alert('변경 실패: ' + error.message); return; }
  found.item.status = newStatus;
  showDetail(id);
  renderQaList(currentQaTab);
}

function closeDetail() { activeQaCard=null; document.getElementById('qa-modal').classList.remove('open'); renderQaList(currentQaTab); }
function switchRpTab(tab) { currentRpTab=tab; ['info','qa'].forEach(t=>{document.getElementById(`tab-${t}`).classList.toggle('active',t===tab); document.getElementById(`pane-${t}`)?.classList.toggle('active',t===tab);}); }
function switchQaTab(tab,el) { currentQaTab=tab; document.querySelectorAll('.qa-sub-tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); closeDetail(); renderQaList(tab); }
function selectScreen(el,key) {
  currentScreen=key;
  localStorage.setItem('lastScreen', key);
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  if (key === '__unassigned__') {
    document.getElementById('screen-badge').textContent = '미분류 Q&A';
    closeDetail(); renderScreenInfo(null); renderQaList(currentQaTab); switchRpTab('qa');
    loadScreenLinks(null);
  } else {
    document.getElementById('screen-badge').textContent=screens[key].name;
    closeDetail(); renderScreenInfo(key); renderQaList(currentQaTab);
    loadScreenLinks(key);
  }
}
function loadScreenLinks(key) {
  const s = key ? screens[key] : null;
  const lk = JSON.parse(localStorage.getItem('screenLinks')||'{}');
  const local = key ? (lk[key]||{}) : {};
  const figmaUrl = s?.figmaUrl || local.figmaUrl || '';
  const specUrl  = s?.specUrl  || local.specUrl  || '';
  document.getElementById('figma-url').value = figmaUrl;
  const specRangeSep = specUrl.indexOf('#range=');
  document.getElementById('spec-url').value   = specRangeSep !== -1 ? specUrl.slice(0, specRangeSep) : specUrl;
  document.getElementById('spec-range').value = specRangeSep !== -1 ? specUrl.slice(specRangeSep + 7) : '';
  // reset figma iframe
  const fi = document.getElementById('figma-iframe');
  fi.src = ''; fi.style.display = 'none';
  document.getElementById('figma-ph').style.display = 'flex';
  // reset spec iframe
  const si = document.getElementById('spec-iframe');
  si.src = '';
  document.getElementById('spec-iframe-wrap').style.display = 'none';
  document.getElementById('spec-range-content').style.display = 'none';
  document.getElementById('spec-empty').style.display = 'block';
  // auto-load if saved
  if (figmaUrl) loadFigma(false);
  if (specUrl)  loadSpec(false);
}
function activateSb(el) { document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active')); el.classList.add('active'); }

function sbDragStart(e, key) {
  dragSrcKey = key;
  setTimeout(() => e.target.classList.add('dragging'), 0);
  e.dataTransfer.effectAllowed = 'move';
}
function sbDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function sbDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}
function sbDragEnd(e) {
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('dragging', 'drag-over'));
  dragSrcKey = null;
}
function sbDrop(e, targetKey) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragSrcKey || dragSrcKey === targetKey) return;
  const si = screenOrder.indexOf(dragSrcKey), ti = screenOrder.indexOf(targetKey);
  screenOrder.splice(si, 1);
  screenOrder.splice(ti, 0, dragSrcKey);
  renderSidebarScreens();
  saveScreenOrder();
}
async function saveScreenOrder() {
  await Promise.all(screenOrder.map((key, idx) => sb.from('screens').update({sort_order: idx}).eq('id', key)));
}
function loadFigma(save=true) {
  const u=document.getElementById('figma-url').value.trim(); if(!u) return;
  const f=document.getElementById('figma-iframe');
  f.src='https://www.figma.com/embed?embed_host=share&url='+encodeURIComponent(u);
  f.style.display='block'; document.getElementById('figma-ph').style.display='none';
  if(save && currentScreen && currentScreen!=='__unassigned__') {
    screens[currentScreen].figmaUrl=u;
    const lk=JSON.parse(localStorage.getItem('screenLinks')||'{}');
    if(!lk[currentScreen]) lk[currentScreen]={};
    lk[currentScreen].figmaUrl=u;
    localStorage.setItem('screenLinks',JSON.stringify(lk));
    const nodeIdMatch=u.match(/[?&]node-id=([^&#]+)/);
    const figmaNodeId=nodeIdMatch ? decodeURIComponent(nodeIdMatch[1]).replace(/-/g,':') : null;
    const updatePayload={figma_url:u};
    if(figmaNodeId) { updatePayload.figma_node_id=figmaNodeId; screens[currentScreen].figmaNodeId=figmaNodeId; }
    sb.from('screens').update(updatePayload).eq('id',currentScreen)
      .then(({error})=>{ if(error){console.error('figma_url 저장 실패:',error);showToast('저장 실패: '+error.message,'err');}else{showToast('피그마 링크 저장됨');} });
  }
}
function openFigma() { const u=document.getElementById('figma-url').value.trim(); if(u) window.open(u,'_blank'); }
function loadSpec(save=true) {
  const u=document.getElementById('spec-url').value.trim(); if(!u) return;
  const range=document.getElementById('spec-range').value.trim();
  const sheetMatch=u.match(/\/d\/([a-zA-Z0-9_-]+)/);
  const gidMatch=u.match(/[?&#]gid=([0-9]+)/);
  document.getElementById('spec-empty').style.display='none';
  if(sheetMatch && range) {
    const sheetId=sheetMatch[1], gid=gidMatch?gidMatch[1]:'';
    document.getElementById('spec-iframe-wrap').style.display='none';
    const el=document.getElementById('spec-range-content');
    el.style.display='block'; el.innerHTML='<p style="color:var(--text3);padding:8px 0">불러오는 중...</p>';
    const cb='__specGviz__';
    window[cb]=function(data){
      const old=document.getElementById('__spec_script__'); if(old) old.remove();
      delete window[cb];
      if(!data||!data.table){el.innerHTML='<p style="color:var(--text3)">데이터를 불러올 수 없어요. 시트 공유 설정을 확인하세요.</p>';return;}
      const cols=data.table.cols||[];
      const rows=data.table.rows||[];
      const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
      const hasColLabels=cols.some(c=>c.label);
      let html='<table class="spec-table">';
      if(hasColLabels) html+='<thead><tr>'+cols.map(c=>`<th>${esc(c.label)}</th>`).join('')+'</tr></thead>';
      html+='<tbody>';
      rows.forEach(row=>{
        if(!row.c) return;
        html+='<tr>'+row.c.map(cell=>`<td>${esc(cell?.v)}</td>`).join('')+'</tr>';
      });
      html+='</tbody></table>';
      el.innerHTML=html||'<p style="color:var(--text3)">내용 없음</p>';
    };
    const s=document.createElement('script'); s.id='__spec_script__';
    s.src=`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=0${gid?'&gid='+gid:''}&range=${range}`;
    document.head.appendChild(s);
  } else {
    document.getElementById('spec-range-content').style.display='none';
    const f=document.getElementById('spec-iframe');
    const sheetId=sheetMatch?sheetMatch[1]:'', gid=gidMatch?gidMatch[1]:'';
    f.src=sheetId?'https://docs.google.com/spreadsheets/d/'+sheetId+'/preview?rm=minimal'+(gid?'&gid='+gid:''):u;
    f.style.top='-150px'; f.style.height='calc(100% + 150px)';
    document.getElementById('spec-iframe-wrap').style.display='block';
  }
  if(save && currentScreen && currentScreen!=='__unassigned__') {
    const saveVal = u + (range ? '#range='+range : '');
    screens[currentScreen].specUrl=saveVal;
    const lk=JSON.parse(localStorage.getItem('screenLinks')||'{}');
    if(!lk[currentScreen]) lk[currentScreen]={};
    lk[currentScreen].specUrl=saveVal;
    localStorage.setItem('screenLinks',JSON.stringify(lk));
    sb.from('screens').update({spec_url:saveVal}).eq('id',currentScreen)
      .then(({error})=>{ if(error){console.error('spec_url 저장 실패:',error);showToast('저장 실패: '+error.message,'err');}else{showToast('명세서 링크 저장됨');} });
  }
}
function toggleSpec() { specOpen=!specOpen; document.getElementById('spec-panel').classList.toggle('open',specOpen); document.getElementById('spec-lbl').textContent=specOpen?'접기':'펼치기'; }
async function submitQ() {
  const q=document.getElementById('compose-q').value.trim();
  if(!q) return;
  const {data:inserted,error}=await sb.from('qa_items').insert({screen_id:currentScreen||null,question:q,status:'open',source:'manual',tags:['기타']}).select().single();
  if(error){console.error(error);return;}
  if(!qaData[currentScreen]) qaData[currentScreen]=[];
  qaData[currentScreen].unshift({id:inserted.id,q:inserted.question,a:'',status:'open',tags:['기타'],source:'manual',time:'방금'});
  document.getElementById('compose-q').value='';
  renderQaList(currentQaTab);
  switchRpTab('qa');
}

// 사이드바 화면 목록 렌더링
function renderSidebarScreens() {
  const container = document.getElementById('sb-screens');
  const unassignedCount = (qaData['__unassigned__']||[]).length;
  const unassignedItem = unassignedCount > 0
    ? `<div class="sb-item${currentScreen==='__unassigned__'?' active':''}" onclick="selectScreen(this,'__unassigned__')" style="border-left-color:var(--blue)">
        <div class="sb-dot" style="background:var(--blue)"></div>미분류 Q&A
        <span class="sb-count" style="${currentScreen==='__unassigned__'?'background:rgba(96,165,250,0.15);color:var(--blue)':''}">${unassignedCount}</span>
      </div>`
    : '';
  container.innerHTML = screenOrder.filter(key=>screens[key]).map(key => {
    const s = screens[key];
    return `<div class="sb-item${currentScreen===key?' active':''}" draggable="true" data-key="${key}"
      onclick="selectScreen(this,'${key}')"
      oncontextmenu="showSbCtxMenu(event,'${key}')"
      ondragstart="sbDragStart(event,'${key}')"
      ondragover="sbDragOver(event)"
      ondragleave="sbDragLeave(event)"
      ondrop="sbDrop(event,'${key}')"
      ondragend="sbDragEnd(event)">
      <div class="sb-dot"></div>${s.name}
      <span class="sb-count">${(qaData[key]||[]).length}</span>
    </div>`;
  }).join('') + unassignedItem;
}

// 모달 열기 (key 있으면 편집 모드)
let editingKey = null;
function openScreenModal(key) {
  editingKey = key || null;
  document.getElementById('modal-title').textContent = key ? '화면 편집' : '화면 추가';
  const s = key ? screens[key] : null;
  document.getElementById('mf-name').value = s ? s.name : '';
  document.getElementById('mf-purpose').value = s ? s.purpose : '';
  document.getElementById('mf-kpis').innerHTML = '';
  document.getElementById('mf-decisions').innerHTML = '';
  document.getElementById('mf-frames').innerHTML = '';
  document.getElementById('mf-owners').innerHTML = '';
  (s?.kpis||[]).forEach(k => addKpiRow(k.name, k.value, k.trend));
  (s?.decisions||[]).forEach(d => addDecisionRow(d.q, d.why, d.reconsider||''));
  (s?.figmaFrames||[]).forEach(f => addFrameRow(f));
  (s?.owners||[]).forEach(o => addOwnerRow(o.name, o.role));
  document.getElementById('screen-modal').classList.add('open');
}
function closeScreenModal() {
  document.getElementById('screen-modal').classList.remove('open');
  editingKey = null;
}
document.getElementById('screen-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeScreenModal(); });

// 동적 행 추가 함수
function addKpiRow(name='', value='', trend='') {
  const row = document.createElement('div'); row.className = 'mf-row';
  row.innerHTML = `<input class="mf-input" placeholder="지표명" value="${name}"><input class="mf-input" placeholder="목표값" value="${value}"><input class="mf-input" placeholder="트렌드 (예: ↑ 54%)" value="${trend}"><button class="mf-remove" onclick="this.parentElement.remove()">✕</button>`;

}
function addDecisionRow(q='', why='', reconsider='') {
  const row = document.createElement('div'); row.className = 'mf-row'; row.style.cssText='flex-direction:column;gap:5px;position:relative';
  row.innerHTML = `<button class="mf-remove" onclick="this.closest('.mf-row').remove()" style="position:absolute;top:0;right:0">✕</button><textarea class="mf-input" placeholder="결정 내용" style="min-height:60px;resize:none;width:100%">${q}</textarea><textarea class="mf-input" placeholder="이유" style="min-height:60px;resize:none;width:100%">${why}</textarea><textarea class="mf-input" placeholder="재논의 조건 (선택)" style="min-height:60px;resize:none;width:100%">${reconsider}</textarea>`;

function addFrameRow(val='') {
  const row = document.createElement('div'); row.className = 'mf-row';
  row.innerHTML = `<input class="mf-input" placeholder="피그마 프레임명" value="${val}"><button class="mf-remove" onclick="this.parentElement.remove()">✕</button>`;

function addOwnerRow(name='', role='') {
  const row = document.createElement('div'); row.className = 'mf-row';
  row.innerHTML = `<input class="mf-input" placeholder="이름" value="${name}"><input class="mf-input" placeholder="팀" value="${role}"><button class="mf-remove" onclick="this.parentElement.remove()">✕</button>`;

// 저장
async function saveScreen() {
  const name = document.getElementById('mf-name').value.trim();
  if (!name) { document.getElementById('mf-name').focus(); return; }
  const kpiRows = document.getElementById('mf-kpis').querySelectorAll('.mf-row');
  const decRows = document.getElementById('mf-decisions').querySelectorAll('.mf-row');
  const frmRows = document.getElementById('mf-frames').querySelectorAll('.mf-row');
  const ownRows = document.getElementById('mf-owners').querySelectorAll('.mf-row');
  const payload = {
    name,
    purpose: document.getElementById('mf-purpose').value.trim(),
    kpis: [...kpiRows].map(r => { const i=r.querySelectorAll('input'); return {name:i[0].value.trim(),value:i[1].value.trim(),trend:i[2].value.trim()}; }).filter(k=>k.name),
    decisions: [...decRows].map(r => { const t=r.querySelectorAll('textarea'); return {q:t[0].value.trim(),why:t[1].value.trim(),reconsider:t[2]?t[2].value.trim():''}; }).filter(d=>d.q),
    figma_frames: [...frmRows].map(r => r.querySelector('input').value.trim()).filter(Boolean),
    owners: [...ownRows].map(r => { const i=r.querySelectorAll('input'); return {name:i[0].value.trim(),role:i[1].value.trim()}; }).filter(o=>o.name),
  };
  let key;
  if (editingKey) {
    const {error} = await sb.from('screens').update(payload).eq('id', editingKey);
    if (error) { alert('저장 실패: ' + error.message); return; }
    key = editingKey;
  } else {
    const {data:row, error} = await sb.from('screens').insert({...payload, sort_order: screenOrder.length}).select().single();
    if (error) { alert('저장 실패: ' + error.message); return; }
    key = row.id;
    screenOrder.push(key);
  }
  screens[key] = {name:payload.name, purpose:payload.purpose, kpis:payload.kpis, decisions:payload.decisions, figmaFrames:payload.figma_frames, owners:payload.owners, history:screens[key]?.history||[]};
  if (!editingKey) currentScreen = key;
  closeScreenModal();
  renderSidebarScreens();
  document.getElementById('screen-badge').textContent = screens[key].name;
  renderScreenInfo(key);
  renderQaList(currentQaTab);
  searchIndex = buildIndex();
}

// 우측 패널 저장

  const name = document.getElementById('rp-name').value.trim();
  if (!name) { document.getElementById('rp-name').focus(); return; }
  const payload = {
    name,
    purpose: document.getElementById('rp-purpose').value.trim(),
    kpis: [...document.getElementById('rp-kpis').querySelectorAll('.mf-row')].map(r=>{const i=r.querySelectorAll('input');return{name:i[0].value.trim(),value:i[1].value.trim(),trend:i[2].value.trim()};}).filter(k=>k.name),
    decisions: [...document.getElementById('rp-decisions').querySelectorAll('.mf-row')].map(r=>{const t=r.querySelectorAll('textarea');return{q:t[0].value.trim(),why:t[1].value.trim(),reconsider:t[2]?t[2].value.trim():''}}).filter(d=>d.q),
    owners: [...document.getElementById('rp-owners').querySelectorAll('.mf-row')].map(r=>{const i=r.querySelectorAll('input');return{name:i[0].value.trim(),role:i[1].value.trim()};}).filter(o=>o.name),
    history: [...document.getElementById('rp-history').querySelectorAll('.mf-row')].map(r=>{const inp=r.querySelector('input');const ta=r.querySelector('textarea');return{date:inp?inp.value.trim():'',content:ta?ta.value.trim():''};}).filter(h=>h.content),
  };
  const {error} = await sb.from('screens').update(payload).eq('id', currentScreen);

  renderSidebarScreens();
  document.getElementById('screen-badge').textContent = name;
  renderScreenInfo(currentScreen);

}

function nl2br(text) {
  return String(text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date(), diff = now - d;
  if (diff < 60000) return '방금';
  if (diff < 3600000) return Math.floor(diff/60000) + '분 전';
  if (diff < 86400000) return Math.floor(diff/3600000) + '시간 전';
  return d.toLocaleDateString('ko-KR', {month:'short', day:'numeric'});
}

async function init() {
  const {data:sData, error:sErr} = await sb.from('screens').select('*').order('sort_order').order('created_at');
  if (sErr) console.error('screens 로드 실패:', sErr);
  (sData||[]).forEach(row => {
    screens[row.id] = {name:row.name, purpose:row.purpose||'', kpis:row.kpis||[], decisions:row.decisions||[], figmaFrames:row.figma_frames||[], owners:row.owners||[], history:row.history||[], figmaUrl:row.figma_url||'', specUrl:row.spec_url||''};
    screenOrder.push(row.id);
  });
  const {data:qData, error:qErr} = await sb.from('qa_items').select('*').order('created_at', {ascending:false});
  if (qErr) console.error('qa_items 로드 실패:', qErr);
  (qData||[]).forEach(row => {
    const k = row.screen_id || '__unassigned__';
    if (!qaData[k]) qaData[k] = [];
    const ans = row.answers && row.answers.length ? row.answers : (row.answer ? [{text:row.answer, created_at:row.created_at}] : []);
    qaData[k].push({id:row.id, q:row.question, answers:ans, a:ans.length?ans[0].text:'', status:row.status, tags:row.tags||[], source:row.source, sourceUrl:row.source_url||'', time:formatTime(row.created_at), itemType:row.item_type||'qa'});
  });
  searchIndex = buildIndex();
  sb.channel('realtime-qa')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'qa_items'}, payload => {
      const row = payload.new;
      const k = row.screen_id || '__unassigned__';
      if (!qaData[k]) qaData[k] = [];
      const ans = row.answers && row.answers.length ? row.answers : (row.answer ? [{text:row.answer, created_at:row.created_at}] : []);
      qaData[k].unshift({id:row.id, q:row.question, answers:ans, a:ans.length?ans[0].text:'', status:row.status, tags:row.tags||[], source:row.source, time:'방금'});
      if (k === currentScreen) renderQaList(currentQaTab);
      renderSidebarScreens();
      searchIndex = buildIndex();
    })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'qa_items'}, payload => {
      const row = payload.new;
      const found = findQaItem(row.id);
      if (found) {
        const ans = row.answers && row.answers.length ? row.answers : (row.answer ? [{text:row.answer}] : []);
        found.item.answers = ans;
        found.item.a = ans.length ? ans[0].text : '';
        found.item.status = row.status;
        found.item.q = row.question;
        if (found.screenKey === currentScreen) renderQaList(currentQaTab);
        if (activeQaCard === row.id) showDetail(row.id);
      }
    })
    .subscribe();
  renderSidebarScreens();
  renderQaList('all');
  // restore last selected screen
  const lastKey = localStorage.getItem('lastScreen');
  const restoreKey = (lastKey && (screens[lastKey] || lastKey==='__unassigned__')) ? lastKey : screenOrder[0];
  if (restoreKey) {
    currentScreen = restoreKey;
    const el = document.querySelector(`.sb-item[data-key="${restoreKey}"]`);
    if (el) { document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active')); el.classList.add('active'); }
    if (restoreKey === '__unassigned__') {
      document.getElementById('screen-badge').textContent='미분류 Q&A';
      renderScreenInfo(null); renderQaList(currentQaTab); switchRpTab('qa'); loadScreenLinks(null);
    } else if (screens[restoreKey]) {
      document.getElementById('screen-badge').textContent=screens[restoreKey].name||'';
      renderScreenInfo(restoreKey); renderQaList(currentQaTab); loadScreenLinks(restoreKey);
    }
  }
}

init();

document.getElementById('qa-modal').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

let _toastTimer=null;
function showToast(msg, type='ok') {
  const t=document.getElementById('save-toast');
  t.textContent=msg; t.className='show '+type;
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.className='',2000);
}

let _ctxKey=null;
function showSbCtxMenu(e, key) {
  e.preventDefault();
  _ctxKey=key;
  const m=document.getElementById('sb-ctx-menu');
  m.style.display='block';
  m.style.left=e.clientX+'px';
  m.style.top=e.clientY+'px';
}
function hideSbCtxMenu() {
  document.getElementById('sb-ctx-menu').style.display='none';
  _ctxKey=null;
}
async function deleteScreen() {
  if(!_ctxKey) return;
  const key=_ctxKey;
  hideSbCtxMenu();
  if(!confirm(`'${screens[key]?.name}' 화면을 삭제할까요? Q&A도 함께 삭제됩니다.`)) return;
  await sb.from('qa_items').delete().eq('screen_id', key);
  await sb.from('screens').delete().eq('id', key);
  delete screens[key];
  delete qaData[key];
  screenOrder.splice(screenOrder.indexOf(key), 1);
  if(currentScreen===key) {
    currentScreen=null;
    document.getElementById('screen-badge').textContent='';
    document.getElementById('screen-info-content').innerHTML='';
    document.getElementById('rp-save-bar').style.display='none';
    loadScreenLinks(null);
  }
  renderSidebarScreens();
  renderQaList(currentQaTab);
  showToast('화면이 삭제됐어요');
}
document.addEventListener('click', ()=>hideSbCtxMenu());
</script>
<div id="save-toast"></div>
<div id="sb-ctx-menu">
  <div class="sb-ctx-item danger" onclick="deleteScreen()">삭제</div>
</div>
